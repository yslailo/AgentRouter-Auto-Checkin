name: Ayrouter Daily Check-in

on:
  schedule:
    - cron: '0 2 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---------- 检出代码 ----------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------- 安装 Python ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------- 安装 Python 依赖 和 Playwright 浏览器  ----------
      - name: Install Python dependencies
        run: |
          pip install requests playwright pynacl
          playwright install --with-deps chromium

      # ---------- 设置 V2Ray 代理（如果配置了 VMESS_CONFIG）----------
      - name: Setup V2Ray Proxy
        if: ${{ secrets.VMESS_CONFIG != '' }}
        run: |
          # 下载 v2ray-core
          wget -q https://github.com/v2fly/v2ray-core/releases/download/v5.21.0/v2ray-linux-64.zip
          unzip -q v2ray-linux-64.zip -d v2ray
          chmod +x v2ray/v2ray

          # 创建配置文件
          cat > config.json << 'EOF'
          {
            "inbounds": [
              {
                "port": 10808,
                "protocol": "socks",
                "settings": {
                  "udp": true
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "vmess",
                "settings": {
                  "vnext": [
                    {
                      "address": "${{ secrets.VMESS_SERVER }}",
                      "port": ${{ secrets.VMESS_PORT }},
                      "users": [
                        {
                          "id": "${{ secrets.VMESS_UUID }}",
                          "alterId": 0,
                          "security": "auto"
                        }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "tls",
                  "wsSettings": {
                    "path": "${{ secrets.VMESS_PATH }}",
                    "headers": {
                      "Host": "${{ secrets.VMESS_HOST }}"
                    }
                  },
                  "tlsSettings": {
                    "serverName": "${{ secrets.VMESS_SNI }}"
                  }
                }
              }
            ]
          }
          EOF

          # 启动 v2ray（后台运行）
          ./v2ray/v2ray run -c config.json &
          sleep 3
          echo "V2Ray 代理已启动在 socks5://127.0.0.1:10808"

      # ---------- 运行登录签到脚本 ----------
      - name: Run check-in script
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          # 如果配置了 VMESS，使用本地 SOCKS5 代理
          PROXY_SERVER: ${{ secrets.VMESS_CONFIG != '' && 'socks5://127.0.0.1:10808' || secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python app.py
        
      - name: 🧹 clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
